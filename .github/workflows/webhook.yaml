name: webhook

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]
  workflow_run:
    workflows: [build, lint, test, snap]  # names of your CI workflows
    types: [completed]

jobs:
  notify:
    # Only notify on failed CI runs, not on every workflow_run.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'failure'
    permissions:
      actions: read  # to name the failed job/step of a CI run
    uses: canonical/robotics-actions-workflows/.github/workflows/webhook.yaml@feat/webhook
    secrets:
      MM_WEBHOOK_URL: ${{ secrets.MM_WEBHOOK_URL }}
